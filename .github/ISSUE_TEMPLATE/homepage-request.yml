name: 홈페이지 수정 요청
description: 잘못된 내용, 빠진 소식, 고쳤으면 하는 것을 알려 주세요.
title: "[수정 요청] "
body:
  - type: markdown
    attributes:
      value: |
        GitHub 계정이 없으시면 **hiyoon@kasi.re.kr** 또는 **shinykim@kasi.re.kr** 로
        메일 주셔도 됩니다. 아래 내용을 그대로 적어 주시면 처리가 빠릅니다.

  - type: input
    id: page
    attributes:
      label: 어느 페이지인가요
      description: 주소를 붙여 넣어 주세요. 여러 곳이면 모두 적어 주셔도 됩니다.
      placeholder: https://ska.kasi.re.kr/src
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: 무엇을 고쳤으면 하나요
      description: 지금 어떻게 나와 있고 어떻게 바뀌면 좋을지 적어 주세요. 화면을 찍어 붙이셔도 좋습니다.
      placeholder: |
        지금: …
        이렇게: …
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 어떤 종류인가요
      options:
        - 내용이 틀렸습니다
        - 내용이 빠졌습니다 (새 소식·자료 등)
        - 링크가 깨졌습니다
        - 화면이 이상합니다
        - 그 밖에
    validations:
      required: false

  - type: input
    id: who
    attributes:
      label: 회신받을 곳 (선택)
      description: 확인할 것이 있을 때 연락드립니다. GitHub으로 답을 받으셔도 되면 비워 두세요.
      placeholder: name@example.ac.kr
    validations:
      required: false
