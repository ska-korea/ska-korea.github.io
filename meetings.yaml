# 미팅 목록에 쓰이는 제목·날짜·장소·분류.
#
# 본문은 조직위원회가 Google Sites에서 관리한다. 여기서는 목록 화면에 쓸
# 정보만 다룬다.
#
# title    목록에 보일 제목. 적지 않으면 Google Sites 페이지 제목을 그대로 쓴다.
#          ★ 제목 앞에 'Dec 2025' 같은 연·월을 넣지 않는다 — 왼쪽 날짜 칸과 겹치고
#            공식 명칭도 아니다. SKA Korea Workshop은 계절로 통일한다.
# when     'YYYY.MM.DD–DD' 또는 'YYYY.MM.DD–MM.DD'. 정렬 기준이자 표시값.
# where    장소. 확인된 것만 적는다.
# category site.yaml의 meeting_filters 키. 비우면 '전체'에만 나온다.
#
# 명칭·날짜의 출처: 기존 홈페이지 ska.kasi.re.kr/meetings 의 분류 목록.

