<!doctype html>
{# Google Sites 시절의 옛 주소에 세우는 이정표. 곧바로 새 주소로 보낸다. #}
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url={{ page.target }}">
<link rel="canonical" href="{{ page.target }}">
<title>{{ page.title }} · {{ site.title }}</title>
<p>This page has moved: <a href="{{ page.target }}">{{ page.target }}</a></p>
</html>
