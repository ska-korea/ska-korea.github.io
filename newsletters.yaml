# SKA Korea 소식지 목록.
#
# id     구글 드라이브 파일 ID (공유 링크의 /file/d/<여기>/view)
# date   YYYY-MM. 정렬 기준이자 표시용. 합본호는 시작 달을 적는다.
# label  화면에 보일 이름. 비우면 date에서 만든다.
# crop   (선택) 썸네일로 쓸 영역 [x0, y0, x1, y1] — PDF 좌표(pt, A4는 595x842).
#        비우면 첫 쪽에서 가장 큰 사진을 자동으로 찾아 쓴다.
#
# 새 호를 올리려면 맨 위에 세 줄만 추가하고 tools/newsletters.py 를 돌리면 된다.

issues:
